<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>公主化妆小游戏</title>
<style>
  :root{
    color-scheme: light;
    --pink:#ff6fa5; --pink-deep:#e8437f; --pink-soft:#ffe3ef;
    --ink:#5b3a4e; --card:#ffffff; --bg:#fff7fa;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe0ee 0, transparent 34%),
      radial-gradient(circle at 88% 4%, #e9e2ff 0, transparent 36%),
      radial-gradient(circle at 50% 108%, #fff0d6 0, transparent 42%),
      var(--bg);
    color:var(--ink); min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:14px 14px 40px;}
  header{text-align:center;padding:10px 4px 14px;}
  header h1{font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:2px;color:var(--pink-deep);text-shadow:0 2px 0 #ffd3e4,0 5px 14px rgba(232,67,127,.22);}
  header h1 .crown{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
  header p{margin-top:6px;font-size:15px;color:#a06a86;font-weight:600;}
  .princess-name{display:inline-block;margin-top:10px;background:#fff;border:2px dashed #ffb9d2;border-radius:999px;padding:6px 18px;font-size:14px;font-weight:700;color:var(--pink-deep);box-shadow:0 4px 14px rgba(232,67,127,.12);}
  .layout{display:flex;gap:16px;align-items:flex-start;}
  @media (max-width:820px){.layout{flex-direction:column;}}
  .stage-card{flex:1 1 46%;background:var(--card);border-radius:30px;padding:14px;box-shadow:0 18px 40px rgba(232,67,127,.16),0 2px 0 #fff inset;border:3px solid #ffd9e8;position:relative;width:100%;}
  .stage{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/4.6;max-height:660px;margin:0 auto;width:100%;transition:background .5s;box-shadow:inset 0 0 0 3px rgba(255,255,255,.65), inset 0 -30px 50px rgba(255,255,255,.25);}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(120,40,80,.12));}
  .bg-castle{background:linear-gradient(180deg,#fff0f7 0%,#ffe0ee 42%,#ffd1e3 78%,#ffc2d8 100%);}
  .bg-garden{background:linear-gradient(180deg,#dff6ff 0%,#eafbe7 55%,#cdeed2 100%);}
  .bg-star{background:linear-gradient(180deg,#2d2a55 0%,#574b8f 55%,#8a6fb8 100%);}
  .bg-rainbow{background:linear-gradient(180deg,#cfeeff 0%,#ffeef8 55%,#fff3cf 100%);}
  .stage-actions{display:flex;gap:10px;margin-top:14px;}
  .big-btn{flex:1;min-height:56px;border:none;border-radius:18px;cursor:pointer;font-size:18px;font-weight:900;letter-spacing:1px;font-family:inherit;transition:transform .12s, box-shadow .12s;}
  .big-btn:active{transform:scale(.96);}
  .btn-random{background:linear-gradient(135deg,#ffb3d1,#ff8fb8);color:#fff;box-shadow:0 6px 0 #e87ba6,0 10px 18px rgba(232,67,127,.25);}
  .btn-done{background:linear-gradient(135deg,#ffd166,#f5a623);color:#7a4a00;box-shadow:0 6px 0 #d18d12,0 10px 18px rgba(245,166,35,.3);}
  .btn-reset{flex:0 0 56px;background:#fff;border:3px solid #ffd9e8;color:var(--pink-deep);font-size:22px;border-radius:18px;cursor:pointer;min-height:56px;}
  .btn-reset:active{transform:scale(.94);}
  .panel{flex:1 1 54%;display:flex;flex-direction:column;gap:12px;width:100%;}
  .tool{background:var(--card);border-radius:22px;padding:14px 16px 16px;border:3px solid #ffe7f1;box-shadow:0 8px 20px rgba(232,67,127,.08);}
  .tool h2{font-size:17px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .tool h2 .ic{width:34px;height:34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;background:var(--pink-soft);flex:0 0 auto;}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:48px;height:48px;border-radius:50%;border:4px solid #fff;cursor:pointer;box-shadow:0 3px 8px rgba(91,58,78,.22),0 0 0 2px #f3d7e4;position:relative;transition:transform .12s;font-size:20px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:inherit;}
  .sw:active{transform:scale(.9);}
  .sw.on{box-shadow:0 3px 8px rgba(91,58,78,.22),0 0 0 4px var(--pink);}
  .sw.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);}
  .sw.none{background:#fff;color:#c9a3b5;font-size:22px;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{min-height:48px;padding:8px 18px;border-radius:999px;cursor:pointer;border:3px solid #ffd9e8;background:#fff8fb;font-size:16px;font-weight:800;color:var(--ink);font-family:inherit;transition:transform .12s, background .15s;display:inline-flex;align-items:center;gap:6px;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 5px 12px rgba(232,67,127,.3);}
  .sparkle{position:absolute;pointer-events:none;z-index:30;animation:sparkFly .8s ease-out forwards;font-size:20px;line-height:1;}
  @keyframes sparkFly{0%{transform:translate(0,0) scale(.4) rotate(0deg);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(140deg);opacity:0;}}
  .princess-bounce{animation:pbounce .45s ease;}
  @keyframes pbounce{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
  #princessSvg{transform-origin:50% 60%;}
  .overlay{position:fixed;inset:0;z-index:100;display:none;background:rgba(91,42,70,.45);align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .cele-card{background:#fff;border-radius:30px;padding:30px 26px 26px;text-align:center;max-width:400px;width:100%;border:4px solid #ffd166;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .cele-card .big{font-size:58px;line-height:1.1;}
  .cele-card h3{font-size:26px;font-weight:900;color:var(--pink-deep);margin:8px 0 6px;}
  .cele-card p{font-size:16px;color:#a06a86;font-weight:600;line-height:1.6;}
  .cele-card button{margin-top:18px;min-height:54px;padding:10px 34px;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#ff8fb8,#e8437f);color:#fff;font-size:18px;font-weight:900;font-family:inherit;box-shadow:0 6px 0 #c22e63;}
  .cele-card button:active{transform:translateY(3px);box-shadow:0 2px 0 #c22e63;}
  .confetti{position:fixed;top:-30px;z-index:101;pointer-events:none;border-radius:3px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}
  .hint{text-align:center;margin-top:16px;font-size:13px;color:#c79bb2;font-weight:600;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
